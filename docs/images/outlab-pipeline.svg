<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">How OutLab processes a ride</title>
  <desc id="desc">Three recordings (EmotiBit sensor CSV, up to four Insta360 videos, a GPX route) are imported and checked, placed on one sensor time axis, analysed with a core EDA pipeline plus optional artifact methods, reviewed as candidate moments, used in a stimulated-recall interview and exported.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2f44"/>
    </marker>
    <style>
      text { font-family: Overpass, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1d2f44; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 13px; fill: #56677a; }
      .t { font-size: 13px; }
      .w { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #b9c4cb; stroke-width: 1.2; }
      .core { fill: #ffffff; stroke: #1f5fa8; stroke-width: 2; }
      .opt { fill: #f5f7f6; stroke: #8995a0; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .line { stroke: #1d2f44; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="600" rx="14" fill="#f5f7f6"/>

  <!-- column labels -->
  <text x="40" y="44" class="h">Record outdoors</text>
  <text x="300" y="44" class="h">Check and align</text>
  <text x="600" y="44" class="h">Analyse</text>
  <text x="950" y="44" class="h">Interview and report</text>

  <!-- sources -->
  <g>
    <rect x="40" y="72" width="210" height="96" rx="6" class="box"/>
    <text x="56" y="100" class="h" style="font-size:15px">EmotiBit sensors</text>
    <text x="56" y="122" class="s">Parsed CSV from the official</text>
    <text x="56" y="140" class="s">DataParser: EDA, PPG, IMU,</text>
    <text x="56" y="158" class="s">temperature (+ _info.json)</text>

    <rect x="40" y="184" width="210" height="96" rx="6" class="box"/>
    <text x="56" y="212" class="h" style="font-size:15px">Insta360 video × 4</text>
    <text x="56" y="234" class="s">H.264 MP4 exports, e.g.</text>
    <text x="56" y="252" class="s">4 × 60 min Full HD; played</text>
    <text x="56" y="270" class="s">from disk, never uploaded</text>

    <rect x="40" y="296" width="210" height="78" rx="6" class="box"/>
    <text x="56" y="324" class="h" style="font-size:15px">GPX route</text>
    <text x="56" y="346" class="s">Timestamped track points</text>
    <text x="56" y="364" class="s">from any GPS logger</text>
  </g>

  <!-- check & align -->
  <g>
    <rect x="300" y="72" width="240" height="120" rx="6" class="box"/>
    <text x="316" y="100" class="h" style="font-size:15px">Import and data quality</text>
    <text x="316" y="122" class="s">Column/unit mapping, SHA-256</text>
    <text x="316" y="140" class="s">per source, gaps, duplicates and</text>
    <text x="316" y="158" class="s">flat channels reported, raw</text>
    <text x="316" y="176" class="s">headerless packets refused</text>

    <rect x="300" y="210" width="240" height="164" rx="6" class="core"/>
    <text x="316" y="238" class="h" style="font-size:15px">One time axis</text>
    <text x="316" y="260" class="s">Sensor clock is the reference.</text>
    <text x="316" y="278" class="s">Each video: t = rate × t_video</text>
    <text x="316" y="296" class="s">+ offset, from shared events</text>
    <text x="316" y="314" class="s">(e.g. taps on the sensor).</text>
    <text x="316" y="332" class="s">GPX checked separately.</text>
    <text x="316" y="358" class="t" style="fill:#1f5fa8;font-weight:700">Evidence and uncertainty kept</text>
  </g>

  <!-- analyse -->
  <g>
    <rect x="600" y="72" width="300" height="122" rx="6" class="core"/>
    <text x="616" y="100" class="h" style="font-size:15px">Core EDA analysis</text>
    <text x="616" y="122" class="s">NeuroKit2 cleaning (3 Hz) and highpass</text>
    <text x="616" y="140" class="s">tonic/phasic split per gap-free segment;</text>
    <text x="616" y="158" class="s">robust-z candidate screen against a</text>
    <text x="616" y="176" class="s">researcher-chosen reference interval</text>

    <rect x="600" y="210" width="300" height="200" rx="6" class="opt"/>
    <text x="616" y="236" class="h" style="font-size:15px">Optional, in addition</text>
    <text x="616" y="262" class="t">• Quality rules (Kleckner et al. 2018)</text>
    <text x="616" y="286" class="t">• Window-based motion (IMU + GPS)</text>
    <text x="616" y="310" class="t">• Multi-method robustness, support n/N</text>
    <text x="616" y="334" class="t">• Manual labels from video, Cohen's κ</text>
    <text x="616" y="358" class="t">• Ledalab export for CDA/DDA</text>
    <text x="616" y="390" class="s">Raw data never modified</text>
  </g>

  <!-- interview & report -->
  <g>
    <rect x="950" y="72" width="210" height="104" rx="6" class="box"/>
    <text x="966" y="100" class="h" style="font-size:15px">Review moments</text>
    <text x="966" y="122" class="s">Video, route and signals</text>
    <text x="966" y="140" class="s">at the same instant; pick</text>
    <text x="966" y="158" class="s">candidates and contrasts</text>

    <rect x="950" y="192" width="210" height="104" rx="6" class="core"/>
    <text x="966" y="220" class="h" style="font-size:15px">Interview room</text>
    <text x="966" y="242" class="s">Neutral participant view:</text>
    <text x="966" y="260" class="s">no graphs, no labels, open</text>
    <text x="966" y="278" class="s">question, own words first</text>

    <rect x="950" y="312" width="210" height="98" rx="6" class="box"/>
    <text x="966" y="340" class="h" style="font-size:15px">Export</text>
    <text x="966" y="362" class="s">Project package, processed</text>
    <text x="966" y="380" class="s">EDA and interview CSV,</text>
    <text x="966" y="398" class="s">printable method report</text>
  </g>

  <!-- arrows -->
  <path d="M250 120 H280 V132 H296" class="line" marker-end="url(#arrow)"/>
  <path d="M250 232 H275 V292 H296" class="line" marker-end="url(#arrow)"/>
  <path d="M250 335 H275 V300" class="line"/>
  <path d="M420 192 V206" class="line" marker-end="url(#arrow)"/>
  <path d="M540 292 H570 V133 H596" class="line" marker-end="url(#arrow)"/>
  <path d="M750 194 V206" class="line" marker-end="url(#arrow)"/>
  <path d="M900 133 H946" class="line" marker-end="url(#arrow)"/>
  <path d="M1055 176 V188" class="line" marker-end="url(#arrow)"/>
  <path d="M1055 296 V308" class="line" marker-end="url(#arrow)"/>

  <!-- footer band -->
  <rect x="40" y="446" width="1120" height="118" rx="6" fill="#1f5fa8"/>
  <rect x="58" y="466" width="22" height="6" fill="#f4c20d"/>
  <text x="58" y="500" class="w" style="font-size:16px;font-weight:700">Local by design</text>
  <text x="58" y="524" class="w" style="font-size:13.5px">Runs on 127.0.0.1. Videos stay on disk; CSV and GPX go only to the local Python engine. No external maps, fonts, analytics or API keys.</text>
  <text x="58" y="546" class="w" style="font-size:13.5px">OutLab does not diagnose emotion or stress: candidates are exploratory and are interpreted with the video and the participant's account.</text>
</svg>
