name: Desktop apps

# Builds the macOS disk images and the Windows installer, runs a self-test of
# each packaged app, and publishes them as a GitHub release.
# Trigger: push a tag like v1.4.0, or run manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.4.0)"
        required: true
        default: "1.4.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: OutLab-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            asset: OutLab-macOS-Intel.dmg
          - os: windows-latest
            asset: OutLab-Windows-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          v="${{ inputs.version || github.ref_name }}"
          echo "VERSION=${v#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the interface
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt "pyinstaller==6.22.3"
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Package with PyInstaller
        run: pyinstaller desktop/outlab.spec --noconfirm --distpath build-desktop/dist --workpath build-desktop/work

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: build-desktop/dist/OutLab.app/Contents/MacOS/OutLab --self-test

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build-desktop\dist\OutLab\OutLab.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\OutLab\outlab.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: desktop/macos/make_dmg.sh "release/${{ matrix.asset }}"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:VERSION" "desktop\windows\outlab.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.version || github.ref_name }}"; v="${v#v}"; tag="v$v"
          ls -la release
          if [ -z "$(ls -A release)" ]; then echo "No packages were built." >&2; exit 1; fi
          ( cd release && sha256sum * > SHA256SUMS.txt )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "OutLab $v" --notes-file desktop/RELEASE_NOTES.md --latest
          fi
